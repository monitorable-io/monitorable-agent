name: dist-backstop
# Off-infra backstop for the published release: scripts/check-published-dist.sh against
# prod every 15 minutes, reported to healthchecks.io (check installer-dist-prod), which
# alerts on a failure ping and on missed pings. Spec: platform
# docs/superpowers/specs/2026-09-28-installer-dist-backstop-design.md
#
# Triggered only by workflow_dispatch: every 15 minutes by a systemd timer on a host
# outside our infrastructure (scripts/dist-backstop-dispatch/), plus by hand. There is no
# schedule: trigger on purpose. GitHub's cron never fired at all for its first 6 hours, then
# fired 2 of 42 slots overnight; and a second, sporadic trigger would turn "the timer
# stopped" into a check that flaps up and down instead of staying down.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Which env's published release to check
        type: choice
        options: [prod, staging]
        default: prod
      selftest:
        description: "fail = check against the OTHER env's key, to prove the alert path"
        type: choice
        options: [none, fail]
        default: none
permissions:
  contents: read
concurrency:
  group: dist-backstop-${{ inputs.env }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK_ENV: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the published release
        id: check
        # Worst case: 8 requests x (20s x 3 tries) per pass, two passes, plus the 180s
        # re-check delay. The step, not the job, times out, so the ping still runs.
        timeout-minutes: 25
        env:
          CHECK_KEY_FILE: ${{ inputs.selftest == 'fail' && format('distribution/keys/{0}.pub', inputs.env == 'prod' && 'staging' || 'prod') || '' }}
          CHECK_RETRY_DELAY: ${{ inputs.selftest == 'fail' && '0' || '' }}
        # shell: bash (explicit) runs with -o pipefail, so tee does not hide the exit status.
        shell: bash
        run: scripts/check-published-dist.sh "$CHECK_ENV" 2>&1 | tee "$RUNNER_TEMP/backstop.log"
      - name: Report to healthchecks.io
        # Prod only, and only from main: a run of a branch's copy of this file never pings.
        # Only a check that actually ran (passed, failed, or timed out, which is a failure)
        # reports: a GitHub-side failure before it (checkout) or a cancelled run sends
        # nothing, so it surfaces as a missed ping ("backstop stopped"), never as a false
        # installer alarm.
        if: >-
          always() && env.CHECK_ENV == 'prod' && github.ref == 'refs/heads/main' &&
          (steps.check.outcome == 'success' || steps.check.outcome == 'failure')
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL_DIST }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [ -z "$HC_PING_URL" ]; then
            echo "HC_PING_URL_DIST is not set: not pinging"; exit 0
          fi
          log="$RUNNER_TEMP/backstop.log"
          [ -s "$log" ] || echo "no output: the check step ended as '$OUTCOME'" > "$log"
          rc=0; [ "$OUTCOME" = success ] || rc=1
          curl -fsS -m 10 --retry 3 --data-binary @"$log" "$HC_PING_URL/$rc" > /dev/null
          echo "pinged healthchecks.io with exit status $rc"
